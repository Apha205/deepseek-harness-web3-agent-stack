name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# NOTE: only actions/checkout is used — third-party marketplace actions
# (docker/*, pnpm/*, setup-*) do not resolve under this org's Actions
# policy. Node + corepack ship on ubuntu-latest runners, so pnpm comes
# from corepack and the lockfile pins every dependency.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
